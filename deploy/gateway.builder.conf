server {
    listen 192.168.8.4:80;
    server_name builder.jjm.atmy.work;
    return 308 https://builder.jjm.atmy.work$request_uri;
}

server {
    listen 192.168.8.4:443 ssl;
    server_name builder.jjm.atmy.work;

    location /api/ {
        proxy_pass http://127.0.0.1:18111;
        include /etc/nginx/jjm/proxy.conf;
        client_max_body_size 3m;
    }

    location / {
        proxy_pass http://127.0.0.1:18110;
        include /etc/nginx/jjm/proxy.conf;
    }
}
