# 本地 Docker 开发环境：源码热更新，API 仍使用 Docker 执行器。
# 通过 deploy/dev.sh 启动；它会生成 var/docker-dev/compose.env 并构建镜像。
name: builder-service-dev

x-dev: &dev
  image: builder-service-dev:local
  user: '${BUILDER_UID:?Set BUILDER_UID}:${BUILDER_GID:?Set BUILDER_GID}'
  init: true
  volumes: &source
    - ..:/app
    - node_modules:/app/node_modules
    - server_node_modules:/app/apps/server/node_modules
    - web_node_modules:/app/apps/web/node_modules

services:
  deps:
    <<: *dev
    command: ['sh', '/app/deploy/dev-deps.sh']

  api:
    <<: *dev
    depends_on:
      deps:
        condition: service_completed_successfully
    # 调度锁记录 PID，使用宿主 PID 命名空间以便重启后识别（与生产一致）。
    pid: host
    group_add:
      - '${DOCKER_SOCKET_GID:?Set DOCKER_SOCKET_GID}'
    env_file: ${BUILDER_DEV_ENV_FILE:?Set BUILDER_DEV_ENV_FILE}
    command: ['npm', 'run', 'dev', '-w', '@builder/server']
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - server_node_modules:/app/apps/server/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      # 任务容器通过宿主路径挂载数据目录，宿主与容器内路径必须一致。
      - '${BUILDER_DATA_DIR:?Set BUILDER_DATA_DIR}:${BUILDER_DATA_DIR}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/api/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  web:
    <<: *dev
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      API_PROXY_TARGET: http://api:3000
      # Docker Desktop 的 bind mount 收不到文件事件时，设为 1 改用轮询。
      VITE_USE_POLLING: ${VITE_USE_POLLING:-0}
    command:
      ['npm', 'run', 'dev', '-w', '@builder/web', '--', '--host', '0.0.0.0']
    ports:
      - '127.0.0.1:5173:5173'

volumes:
  node_modules:
  server_node_modules:
  web_node_modules:
